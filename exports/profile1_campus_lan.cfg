! ============================================================
! CAMPUS-LAN-CORE-SW1 - Layer 3 Core/Distribution Switch Config
! Profile: Campus LAN | Root Prefix: 10.10.0.0/16
! ============================================================
enable
configure terminal
hostname CAMPUS-LAN-CORE-SW1
no ip domain-lookup
service password-encryption
ip routing
!
! --- IEEE 802.1Q VLAN Database & Blackhole Native VLAN ---
vlan 999
 name BLACKHOLE_NATIVE
 exit
vlan 10
 name CAMPUS_WORKSTATIONS
 exit
vlan 20
 name CAMPUS_WIRELESS_POE
 exit
vlan 30
 name CAMPUS_VOIP
 exit
vlan 99
 name CAMPUS_NETMGMT
 exit
!
! --- IEEE 802.1w Rapid Spanning Tree (Root Primary) ---
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,99 root primary
spanning-tree portfast bpduguard default
!
! --- Pruned 802.1Q Downlink Trunks ---
interface GigabitEthernet0/1
 description Trunk to CAMPUS-LAN-ACC-SW1 (Pruned 802.1Q)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 switchport nonegotiate
 spanning-tree guard root
 no shutdown
!
! --- Routed Uplinks & Switch Virtual Interfaces (SVIs) ---
interface Vlan10
 description Campus-Workstations [CORP] (10.10.0.0/21)
 ip address 10.10.0.1 255.255.248.0
 no shutdown
!
interface Vlan20
 description Campus-Wireless-PoE [CORP] (10.10.8.0/23)
 ip address 10.10.8.1 255.255.254.0
 no shutdown
!
interface Vlan30
 description Campus-VoIP [VOICE] (10.10.10.0/24)
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface Vlan99
 description Campus-NetMgmt [MGMT] (10.10.11.0/26)
 ip address 10.10.11.1 255.255.255.192
 no shutdown
!
! === Extended Security ACLs (Zero-Trust Zone Isolation) ===
ip access-list extended ACL-MGMT-VTY
 remark Restrict SSH management to internal administrative subnets
 permit tcp 10.10.11.0 0.0.0.63 any eq 22
 deny ip any any log
!
! --- Core Switch OSPFv2 Routing ---
router ospf 1
 router-id 10.255.255.10
 passive-interface default
 no passive-interface GigabitEthernet0/24
 network 10.10.0.0 0.0.7.255 area 0
 network 10.10.8.0 0.0.1.255 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.11.0 0.0.0.63 area 0
!
end
write memory

! ============================================================
! CAMPUS-LAN-ACC-SW1 - Layer 2 Access Switch Config
! Profile: Campus LAN | PoE Budget: 2520W
! ============================================================
enable
configure terminal
hostname CAMPUS-LAN-ACC-SW1
no ip domain-lookup
service password-encryption
!
vlan 999
 name BLACKHOLE_NATIVE
 exit
vlan 10
 name CAMPUS_WORKSTATIONS
 exit
vlan 20
 name CAMPUS_WIRELESS_POE
 exit
vlan 30
 name CAMPUS_VOIP
 exit
vlan 99
 name CAMPUS_NETMGMT
 exit
!
spanning-tree mode rapid-pvst
!
! --- Uplink Trunk to Core Switch ---
interface GigabitEthernet0/1
 description Uplink to CAMPUS-LAN-CORE-SW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 switchport nonegotiate
 no shutdown
!
! --- Access Edge Ports (PortFast + BPDUGuard) ---
interface range FastEthernet0/1 - 24
 description Endpoint Access Ports (VLAN 10)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Vlan99
 description Management SVI (10.10.11.0/26)
 ip address 10.10.11.2 255.255.255.192
 no shutdown
!
ip default-gateway 10.10.11.1
end
write memory

! ============================================================
! CAMPUS-LAN-EDGE-RTR1 - Edge / WAN Router Config
! IGP: Single-Area OSPFv2 (Area 0) | EGP: None
! ============================================================
enable
configure terminal
hostname CAMPUS-LAN-EDGE-RTR1
no ip domain-lookup
service password-encryption
!
interface Loopback0
 description OSPF/BGP Router-ID Loopback
 ip address 10.255.255.1 255.255.255.255
!
interface GigabitEthernet0/0
 description Core-to-Edge-P2P (10.10.11.64/30)
 ip address 10.10.11.65 255.255.255.252
 no shutdown
!
! --- Sub-5ms Low-Latency Queuing (QoS RFC 4594) ---
class-map match-any CM-REALTIME-EF
 match dscp ef
class-map match-any CM-CRITICAL-AF41
 match dscp af41
!
policy-map PM-WAN-QOS
 class CM-REALTIME-EF
  priority percent 30
 class CM-CRITICAL-AF41
  bandwidth percent 35
 class class-default
  fair-queue
!
interface GigabitEthernet0/0
 service-policy output PM-WAN-QOS
!
! --- OSPFv2 Process ---
router ospf 1
 router-id 10.255.255.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 network 10.10.0.0 0.0.7.255 area 0
 network 10.10.8.0 0.0.1.255 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.11.0 0.0.0.63 area 0
 network 10.10.11.64 0.0.0.3 area 0
!
end
write memory
