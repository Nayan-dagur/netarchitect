! ============================================================
! METRO-MAN-CORE-SW1 - Layer 3 Core/Distribution Switch Config
! Profile: Metro MAN | Root Prefix: 10.20.0.0/16
! ============================================================
enable
configure terminal
hostname METRO-MAN-CORE-SW1
no ip domain-lookup
service password-encryption
ip routing
!
! --- IEEE 802.1Q VLAN Database & Blackhole Native VLAN ---
vlan 999
 name BLACKHOLE_NATIVE
 exit
vlan 10
 name HQ_TRADING_USERS
 exit
vlan 20
 name REMOTE_BRANCHES_CORP
 exit
vlan 40
 name FINTECH_COLO_COMPUTE
 exit
vlan 30
 name LOWLATENCY_VOICE_TRADING
 exit
vlan 99
 name METRO_OOB_MGMT
 exit
!
! --- IEEE 802.1w Rapid Spanning Tree (Root Primary) ---
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,99 root primary
spanning-tree portfast bpduguard default
!
! --- Pruned 802.1Q Downlink Trunks ---
interface GigabitEthernet0/1
 description Trunk to METRO-MAN-ACC-SW1 (Pruned 802.1Q)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 spanning-tree guard root
 no shutdown
!
! --- Routed Uplinks & Switch Virtual Interfaces (SVIs) ---
interface Vlan10
 description HQ-Trading-Users [CORP] (10.20.0.0/24)
 ip address 10.20.0.1 255.255.255.0
 no shutdown
!
interface Vlan20
 description Remote-Branches-Corp [CORP] (10.20.1.0/24)
 ip address 10.20.1.1 255.255.255.0
 no shutdown
!
interface Vlan40
 description FinTech-Colo-Compute [DMZ] (10.20.2.0/26)
 ip address 10.20.2.1 255.255.255.192
 ip access-group ACL-DMZ-V40-IN in
 no shutdown
!
interface Vlan30
 description LowLatency-Voice-Trading [VOICE] (10.20.2.64/26)
 ip address 10.20.2.65 255.255.255.192
 no shutdown
!
interface Vlan99
 description Metro-OOB-Mgmt [MGMT] (10.20.2.128/27)
 ip address 10.20.2.129 255.255.255.224
 no shutdown
!
! === Extended Security ACLs (Zero-Trust Zone Isolation) ===
ip access-list extended ACL-DMZ-V40-IN
 remark Isolate FinTech-Colo-Compute (10.20.2.0/26) from internal Corp/Mgmt planes
 permit udp 10.20.2.0 0.0.0.63 any eq bootps
 permit udp 10.20.2.0 0.0.0.63 any eq domain
 deny ip 10.20.2.0 0.0.0.63 10.20.0.0 0.0.0.255 log
 deny ip 10.20.2.0 0.0.0.63 10.20.1.0 0.0.0.255 log
 deny ip 10.20.2.0 0.0.0.63 10.20.2.64 0.0.0.63 log
 deny ip 10.20.2.0 0.0.0.63 10.20.2.128 0.0.0.31 log
 permit ip 10.20.2.0 0.0.0.63 any
!
! --- Core Switch OSPFv2 Routing ---
router ospf 1
 router-id 10.255.255.10
 passive-interface default
 no passive-interface GigabitEthernet0/24
 network 10.20.0.0 0.0.0.255 area 0
 network 10.20.1.0 0.0.0.255 area 1
 network 10.20.2.0 0.0.0.63 area 2
 network 10.20.2.64 0.0.0.63 area 0
 network 10.20.2.128 0.0.0.31 area 0
!
end
write memory

! ============================================================
! METRO-MAN-ACC-SW1 - Layer 2 Access Switch Config
! Profile: Metro MAN | PoE Budget: 864W
! ============================================================
enable
configure terminal
hostname METRO-MAN-ACC-SW1
no ip domain-lookup
service password-encryption
!
vlan 999
 name BLACKHOLE_NATIVE
 exit
vlan 10
 name HQ_TRADING_USERS
 exit
vlan 20
 name REMOTE_BRANCHES_CORP
 exit
vlan 40
 name FINTECH_COLO_COMPUTE
 exit
vlan 30
 name LOWLATENCY_VOICE_TRADING
 exit
vlan 99
 name METRO_OOB_MGMT
 exit
!
spanning-tree mode rapid-pvst
!
! --- Uplink Trunk to Core Switch ---
interface GigabitEthernet0/1
 description Uplink to METRO-MAN-CORE-SW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 no shutdown
!
! --- Access Edge Ports (PortFast + BPDUGuard) ---
interface range FastEthernet0/1 - 24
 description Endpoint Access Ports (VLAN 10)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Vlan99
 description Management SVI (10.20.2.128/27)
 ip address 10.20.2.130 255.255.255.224
 no shutdown
!
ip default-gateway 10.20.2.129
end
write memory

! ============================================================
! METRO-MAN-EDGE-RTR1 - Edge / WAN Router Config
! IGP: Multi-Area OSPFv2 (Area 0 + Regional Areas) | EGP: eBGP-4 (AS 65200, RFC 4271)
! ============================================================
enable
configure terminal
hostname METRO-MAN-EDGE-RTR1
no ip domain-lookup
service password-encryption
!
interface Loopback0
 description OSPF/BGP Router-ID Loopback
 ip address 10.255.255.1 255.255.255.255
!
interface GigabitEthernet0/0
 description EVPL-Primary-P2P (10.20.2.160/30)
 ip address 10.20.2.161 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description EVPL-Failover-P2P (10.20.2.164/30)
 ip address 10.20.2.165 255.255.255.252
 no shutdown
!
! --- Sub-5ms Low-Latency Queuing (QoS RFC 4594) ---
class-map match-any CM-REALTIME-EF
 match dscp ef
class-map match-any CM-CRITICAL-AF41
 match dscp af41
!
policy-map PM-WAN-QOS
 class CM-REALTIME-EF
  priority percent 30
 class CM-CRITICAL-AF41
  bandwidth percent 35
 class class-default
  fair-queue
!
interface GigabitEthernet0/0
 service-policy output PM-WAN-QOS
!
! --- OSPFv2 Process ---
router ospf 1
 router-id 10.255.255.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 network 10.20.0.0 0.0.0.255 area 0
 network 10.20.1.0 0.0.0.255 area 1
 network 10.20.2.0 0.0.0.63 area 2
 network 10.20.2.64 0.0.0.63 area 0
 network 10.20.2.128 0.0.0.31 area 0
 network 10.20.2.160 0.0.0.3 area 0
 network 10.20.2.164 0.0.0.3 area 0
 area 0 range 10.20.0.0 255.255.252.0
 area 1 range 10.20.1.0 255.255.255.0
 area 2 range 10.20.2.0 255.255.255.192
!
! --- eBGP-4 WAN / Cloud Peering (AS 65200) ---
router bgp 65200
 bgp router-id 10.255.255.1
 bgp log-neighbor-changes
 neighbor 198.51.100.2 remote-as 64512
 neighbor 198.51.100.2 description Upstream WAN / Cloud Peering
 network 10.20.0.0 mask 255.255.252.0
 aggregate-address 10.20.0.0 255.255.252.0 summary-only
!
end
write memory
