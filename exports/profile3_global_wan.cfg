! ============================================================
! GLOBAL-WAN-CORE-SW1 - Layer 3 Core/Distribution Switch Config
! Profile: Global WAN | Root Prefix: 10.30.0.0/16
! ============================================================
enable
configure terminal
hostname GLOBAL-WAN-CORE-SW1
no ip domain-lookup
service password-encryption
ip routing
!
! --- IEEE 802.1Q VLAN Database & Blackhole Native VLAN ---
vlan 999
 name BLACKHOLE_NATIVE
 exit
vlan 51
 name GLOBAL_IOT_SCANNERS_EMEA
 exit
vlan 50
 name GLOBAL_IOT_SCANNERS_AMER
 exit
vlan 10
 name GLOBAL_CORP_OPERATIONS
 exit
vlan 60
 name CLOUD_VPC_WORKLOADS
 exit
vlan 99
 name GLOBAL_SECOPS_MGMT
 exit
!
! --- IEEE 802.1w Rapid Spanning Tree (Root Primary) ---
spanning-tree mode rapid-pvst
spanning-tree vlan 10,50,51,60,99 root primary
spanning-tree portfast bpduguard default
!
! --- Pruned 802.1Q Downlink Trunks ---
interface GigabitEthernet0/1
 description Trunk to GLOBAL-WAN-ACC-SW1 (Pruned 802.1Q)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,50,51,60,99
 switchport nonegotiate
 spanning-tree guard root
 no shutdown
!
! --- Routed Uplinks & Switch Virtual Interfaces (SVIs) ---
interface Vlan51
 description Global-IoT-Scanners-EMEA-APAC [IOT] (10.30.0.0/22)
 ip address 10.30.0.1 255.255.252.0
 ip access-group ACL-IOT-V51-IN in
 no shutdown
!
interface Vlan50
 description Global-IoT-Scanners-Americas [IOT] (10.30.4.0/22)
 ip address 10.30.4.1 255.255.252.0
 ip access-group ACL-IOT-V50-IN in
 no shutdown
!
interface Vlan10
 description Global-Corp-Operations [CORP] (10.30.8.0/23)
 ip address 10.30.8.1 255.255.254.0
 no shutdown
!
interface Vlan60
 description Cloud-VPC-Workloads [CLOUD] (10.30.10.0/24)
 ip address 10.30.10.1 255.255.255.0
 no shutdown
!
interface Vlan99
 description Global-SecOps-Mgmt [MGMT] (10.30.11.0/26)
 ip address 10.30.11.1 255.255.255.192
 no shutdown
!
! === Extended Security ACLs (Zero-Trust Zone Isolation) ===
ip access-list extended ACL-IOT-V51-IN
 remark Isolate Global-IoT-Scanners-EMEA-APAC (10.30.0.0/22) from internal Corp/Mgmt planes
 permit udp 10.30.0.0 0.0.3.255 any eq bootps
 permit udp 10.30.0.0 0.0.3.255 any eq domain
 deny ip 10.30.0.0 0.0.3.255 10.30.8.0 0.0.1.255 log
 deny ip 10.30.0.0 0.0.3.255 10.30.11.0 0.0.0.63 log
 permit ip 10.30.0.0 0.0.3.255 any
!
ip access-list extended ACL-IOT-V50-IN
 remark Isolate Global-IoT-Scanners-Americas (10.30.4.0/22) from internal Corp/Mgmt planes
 permit udp 10.30.4.0 0.0.3.255 any eq bootps
 permit udp 10.30.4.0 0.0.3.255 any eq domain
 deny ip 10.30.4.0 0.0.3.255 10.30.8.0 0.0.1.255 log
 deny ip 10.30.4.0 0.0.3.255 10.30.11.0 0.0.0.63 log
 permit ip 10.30.4.0 0.0.3.255 any
!
! --- Core Switch OSPFv2 Routing ---
router ospf 1
 router-id 10.255.255.10
 passive-interface default
 no passive-interface GigabitEthernet0/24
 network 10.30.0.0 0.0.3.255 area 2
 network 10.30.4.0 0.0.3.255 area 1
 network 10.30.8.0 0.0.1.255 area 0
 network 10.30.10.0 0.0.0.255 area 3
 network 10.30.11.0 0.0.0.63 area 0
!
end
write memory

! ============================================================
! GLOBAL-WAN-ACC-SW1 - Layer 2 Access Switch Config
! Profile: Global WAN | PoE Budget: 1152W
! ============================================================
enable
configure terminal
hostname GLOBAL-WAN-ACC-SW1
no ip domain-lookup
service password-encryption
!
vlan 999
 name BLACKHOLE_NATIVE
 exit
vlan 51
 name GLOBAL_IOT_SCANNERS_EMEA
 exit
vlan 50
 name GLOBAL_IOT_SCANNERS_AMER
 exit
vlan 10
 name GLOBAL_CORP_OPERATIONS
 exit
vlan 60
 name CLOUD_VPC_WORKLOADS
 exit
vlan 99
 name GLOBAL_SECOPS_MGMT
 exit
!
spanning-tree mode rapid-pvst
!
! --- Uplink Trunk to Core Switch ---
interface GigabitEthernet0/1
 description Uplink to GLOBAL-WAN-CORE-SW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,50,51,60,99
 switchport nonegotiate
 no shutdown
!
! --- Access Edge Ports (PortFast + BPDUGuard) ---
interface range FastEthernet0/1 - 24
 description Endpoint Access Ports (VLAN 10)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Vlan99
 description Management SVI (10.30.11.0/26)
 ip address 10.30.11.2 255.255.255.192
 no shutdown
!
ip default-gateway 10.30.11.1
end
write memory

! ============================================================
! GLOBAL-WAN-EDGE-RTR1 - Edge / WAN Router Config
! IGP: Multi-Area OSPFv2 (Area 0 + Regional Areas) | EGP: eBGP-4 (AS 65300, RFC 4271)
! ============================================================
enable
configure terminal
hostname GLOBAL-WAN-EDGE-RTR1
no ip domain-lookup
service password-encryption
!
interface Loopback0
 description OSPF/BGP Router-ID Loopback
 ip address 10.255.255.1 255.255.255.255
!
interface GigabitEthernet0/0
 description WAN-IPsec-VTI-NYC-VPC (10.30.11.64/30)
 ip address 10.30.11.65 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description WAN-IPsec-VTI-NYC-LON (10.30.11.68/30)
 ip address 10.30.11.69 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description WAN-IPsec-VTI-LON-FRA (10.30.11.72/30)
 ip address 10.30.11.73 255.255.255.252
 no shutdown
!
! --- IKEv2 / IPsec AES-256-GCM Site-to-Site VTI (RFC 4301/7296) ---
crypto ikev2 proposal IKEV2-PROP-NETARCH
 encryption aes-gcm-256
 prf sha256
 group 14
!
crypto ikev2 policy IKEV2-POL-NETARCH
 proposal IKEV2-PROP-NETARCH
!
crypto ipsec transform-set TS-AES256-GCM esp-gcm 256
 mode tunnel
!
crypto ipsec profile PROF-IPSEC-VTI
 set transform-set TS-AES256-GCM
!
interface Tunnel0
 description Encrypted WAN Overlay VTI
 ip address 172.31.255.1 255.255.255.252
 tunnel source GigabitEthernet0/0
 tunnel mode ipsec ipv4
 tunnel destination 203.0.113.2
 tunnel protection ipsec profile PROF-IPSEC-VTI
!
! --- OSPFv2 Process ---
router ospf 1
 router-id 10.255.255.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface Tunnel0
 network 10.30.0.0 0.0.3.255 area 2
 network 10.30.4.0 0.0.3.255 area 1
 network 10.30.8.0 0.0.1.255 area 0
 network 10.30.10.0 0.0.0.255 area 3
 network 10.30.11.0 0.0.0.63 area 0
 network 10.30.11.64 0.0.0.3 area 0
 network 10.30.11.68 0.0.0.3 area 0
 network 10.30.11.72 0.0.0.3 area 0
 area 0 range 10.30.0.0 255.255.240.0
 area 1 range 10.30.8.0 255.255.252.0
 area 2 range 10.30.4.0 255.255.252.0
 area 3 range 10.30.0.0 255.255.252.0
!
! --- eBGP-4 WAN / Cloud Peering (AS 65300) ---
router bgp 65300
 bgp router-id 10.255.255.1
 bgp log-neighbor-changes
 neighbor 198.51.100.2 remote-as 64512
 neighbor 198.51.100.2 description Upstream WAN / Cloud Peering
 network 10.30.0.0 mask 255.255.240.0
 aggregate-address 10.30.0.0 255.255.240.0 summary-only
!
end
write memory
